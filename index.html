<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 키 상위 몇 %</title>
<meta name="description" content="키를 입력하면 병역판정검사 신장 분포에서 상위 몇 %인지 알려줘요. 친구에게 공유해서 비교해 보세요.">
<link rel="preload" as="image" href="paper.png" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#AF0000; --bg2:#9C0404; --page:#000000; --ink:#FFF2EA; --ink2:#F0C3B8; --ink3:#D99C93;
  --line:#C01D1D; --line2:#D14A43; --blue:#0FE06D; --bar:#8C0101; --on-ink:#AF0000;
  --serif:'Instrument Serif','Noto Serif KR',serif;
  --kr:'Noto Serif KR',serif;
  --sans:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --ease:cubic-bezier(.19,1,.22,1);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
.kr-t{transform:scaleX(.87) scaleY(1.24);transform-origin:50% 50%}
h1,.sub,.swipe,.mapcap,.scoreTag,.verdict,.vs,.cite,.foot p,.fillO .fu,.sheet h2,.sheet .note,.friend,.feed .fl,.facts dd small,.cta,.fx,.fskip,.btn,.scoreHead .p,.resHead .lab,.resHead .p,.dial .cl,.top .step{font-family:var(--kr)!important}
h1,.sub,.swipe,.mapcap,.scoreTag,.verdict,.vs,.cite,.foot p,.fillO .fu,.sheet h2,.sheet .note,.friend{
  transform:scaleX(.87) scaleY(1.24);transform-origin:50% 50%}
.cta,.fx,.fskip,.btn{font-weight:900!important}
h1,.mapcap,.fillO .fu,.sheet h2,.scoreHead .p,.resHead .lab,.resHead .p,.dial .cl,.top .step{font-weight:900!important}
.sub,.swipe,.scoreTag,.verdict,.vs,.cite,.foot p,.sheet .note,.friend,.fillO .fskip,.fillO .fcite,.facts dt,.facts dd small,.facts .s,.feed .fl{font-weight:700!important}
.cta>span,.fx>span,.fskip>span,.btn>span{display:inline-block;transform:scaleX(.87) scaleY(1.24);transform-origin:50% 50%}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:var(--sat)}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);
  font:400 14px/1.7 var(--sans);letter-spacing:-.02em;word-break:keep-all;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:8px}
.kmap .reg,.kmap .hit,.ruler{outline:none!important}
.kmap .reg:focus-visible{fill:var(--blue);opacity:.6}

.app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow-x:clip;padding-top:var(--sat)}
@media (min-width:431px){.app{box-shadow:0 0 0 1px rgba(255,255,255,.06)}}

.top{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 4px;position:relative}
.back{width:44px;height:44px;display:grid;place-items:center;color:var(--ink);border-radius:50%;transition:background .2s}
.back:active{background:var(--bg2)}
.back[hidden]{display:none}
.top .name{flex:1;padding-left:8px;height:17px;width:auto;object-fit:contain;object-position:left center;display:block;min-width:0}
.top .step{font:500 12px/1 var(--sans);color:var(--ink3);padding-right:10px;font-variant-numeric:tabular-nums}
.prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--ink);transform-origin:0 50%;transform:scaleX(.33);transition:transform .7s var(--ease)}

.screen{flex:1;display:none;flex-direction:column;padding:0 20px}
.screen.on{display:flex;animation:scIn .55s var(--ease) both}
@keyframes scIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.app[data-dir="back"] .screen.on{animation-name:scBack}
@keyframes scBack{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
h1{margin:40px 0 0;text-align:center;text-wrap:balance;font:500 20px/1.55 var(--sans);letter-spacing:-.03em}
.sub{margin:10px 0 0;text-align:center;text-wrap:balance;font:400 12.5px/1.5 var(--sans);color:var(--ink3)}

.friend{margin:14px auto 0;max-width:320px;padding:12px 14px;border-radius:14px;background:var(--bg2);text-align:center;font:400 13px/1.6 var(--sans);color:var(--ink2)}
.friend b{color:var(--ink);font-weight:500}
.friend[hidden]{display:none}

.hbox{margin:auto 0;padding-bottom:8px}
.hrow{position:relative;display:block;min-height:52px}
.rb{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--ink);transition:background .35s,color .35s,border-color .35s,transform .2s}
.rb:active{transform:translateY(-50%) scale(.93);background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.rb svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;fill:none}
.hval{position:relative;display:block;width:100%;text-align:center}
.hval input{width:3.6em;min-width:0;border:0;background:none;outline:0;padding:0;text-align:center;
  font:400 82px/1 var(--serif);letter-spacing:-.03em;color:var(--ink);caret-color:var(--blue)}
.hval .u{position:absolute;top:43%;left:50%;margin-left:1.9em;transform:translateY(-50%);font:400 16px/1 var(--sans);color:var(--ink3);pointer-events:none}
.ruler{margin-top:10px;position:relative;touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.ruler svg{display:block;width:100%}
.rt{stroke:var(--line2);stroke-width:1.5;stroke-linecap:round}
.rt.maj{stroke:var(--ink3)}
.rt.mn{stroke:var(--line2);stroke-width:1;opacity:.55}
.rl{font:500 11px var(--sans);fill:var(--ink3)}
.rneedle{stroke:var(--blue);stroke-width:2.5;stroke-linecap:round}
.ruler::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,var(--bg),transparent 16%,transparent 84%,var(--bg))}
.swipe{margin:2px 0 0;text-align:center;font:400 12.5px/1.5 var(--sans);color:var(--ink3)}

.mapwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:10px}
.kmap{width:auto;height:auto;max-width:min(100%,256px);max-height:56dvh;margin:0 auto;display:block}
.kmap .reg{fill:var(--ink);opacity:.3;stroke:var(--bg);stroke-width:1.2;cursor:pointer;transition:opacity .3s,fill .3s}
.kmap .reg:hover,.kmap .reg.hv{opacity:.52}
.kmap .reg.sel{fill:var(--ink);opacity:1;animation:regPop .6s var(--ease) forwards}
.kmap .hit{fill:transparent;cursor:pointer}
.kmap .lab{font:600 12px var(--sans);fill:var(--ink2);pointer-events:none;transition:fill .3s}
.kmap .lab.sm{font-size:10.5px}
.kmap .lab.sel{fill:var(--on-ink)}
.kmap .lead{stroke:var(--ink3);stroke-width:1;opacity:.55}
.mapcap{margin:12px 0 0;text-align:center;font:500 14px/1.6 var(--sans);color:var(--ink);min-height:1.6em}
.calc{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding-bottom:40px}
.dial{position:relative;width:188px;height:188px}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .trk{stroke:var(--line);stroke-width:2;fill:none}
.dial .arc{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.dial .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.dial .cnt{font:400 46px/1 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dial .cl{margin-top:8px;font:500 11.5px/1 var(--sans);color:var(--ink3)}
.feed{margin:22px 0 0;width:100%;max-width:300px;height:120px;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 28%,#000 78%,transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 28%,#000 78%,transparent)}
.feed .fl{display:flex;align-items:center;gap:8px;height:24px;font:400 12.5px/1 var(--sans);color:var(--ink3);
  animation:flIn .22s var(--ease) both;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .fl:last-child{color:var(--ink)}
.feed .fl .tick{flex:none;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink3);
  background:transparent;display:grid;place-items:center;transition:background .25s,border-color .25s}
.feed .fl .tick svg{width:8px;height:8px;stroke:var(--on-ink);stroke-width:2.6;fill:none;
  stroke-dasharray:12;stroke-dashoffset:12}
.feed .fl.done .tick{background:var(--ink);border-color:var(--ink)}
.feed .fl.done .tick svg{animation:tickDraw .26s var(--ease) forwards}
@keyframes tickDraw{to{stroke-dashoffset:0}}
@keyframes flIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.calcbars{margin-top:24px;width:100%;max-width:300px;height:62px}
.calcbars svg{width:100%;height:100%;display:block}
.calcbars rect{fill:var(--bar);transition:opacity .4s}

.res{padding-top:30px;padding-bottom:10px}
.scr{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:6px}
.scoreHead{display:flex;align-items:flex-end;justify-content:center;gap:6px;line-height:1;margin-top:4px}
.scoreHead .n{font:400 clamp(96px,30vw,132px)/1 var(--serif);letter-spacing:-.04em;display:flex;align-items:flex-end}
.scoreHead .n .reel{display:inline-block;height:1em;overflow:hidden;line-height:1}
.scoreHead .n .reel .strip{display:block;transform:translateY(0);will-change:transform}
@keyframes reelSpin{from{transform:translateY(0)}to{transform:translateY(calc(var(--cell) * -10))}}
.scoreHead .n .reel i{display:block;height:1em;line-height:1em;font-style:normal;text-align:center}
.scoreHead .n .dot{display:inline-block}
.scoreHead .p{font:500 24px/1 var(--sans);padding-bottom:.28em;color:var(--ink2)}
.scoreTag{opacity:0;transition:opacity .7s ease;animation:none!important;margin:16px 0 0;text-align:center;text-wrap:balance;font:400 17px/1.6 var(--sans);letter-spacing:-.02em}
.fillO{position:absolute;inset:0;z-index:200;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;
  padding:calc(16px + var(--sat)) 16px calc(16px + var(--sab));animation:fillIn .4s var(--ease) both}
.fillO[hidden]{display:none}
@keyframes fillIn{from{opacity:0}to{opacity:1}}
.fillO .fh{flex:none;text-align:center;padding:6px 0 14px}
.fillO .fn{font:400 clamp(54px,16vw,78px)/1 var(--serif);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.fillO .fu{margin:10px auto 0;max-width:none;font:500 13px/1.6 var(--sans);opacity:0;transition:opacity .6s ease}
.fillO .fu.on{opacity:.75}
.fillO .fu2{display:block;white-space:nowrap}
.fillO .fgrid{flex:1;min-height:0;overflow:hidden;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px}
.fillO .fgrid svg{display:block;color:var(--bg);opacity:0;animation:pop .32s var(--ease) forwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.fillO .fx{flex:none;margin-top:12px;height:52px;border-radius:14px;border:0;background:var(--bg);color:var(--ink);font:500 15px/1 var(--kr)}
.fillO .fx:active{opacity:.85}
  .fillO .fcite{flex:none;margin:6px 0 0;text-align:center;font:400 8px/1.5 var(--sans);color:var(--bg);opacity:.45;max-width:30em;margin-left:auto;margin-right:auto}
.fillO .fskip{flex:none;margin-top:8px;height:32px;color:var(--bg);opacity:.55;font:500 12.5px/1 var(--kr)}
.cite{margin:20px auto 0;text-align:center;font:400 8.5px/1.6 var(--sans);letter-spacing:0;color:var(--ink3);opacity:.7;max-width:30em}
.resHead{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-top:10px;line-height:1}
.resHead .lab{flex:none;font:500 20px/1 var(--sans);padding-bottom:.62em;color:var(--ink2)}
.resHead .n{font:400 clamp(92px,27vw,124px)/.84 var(--serif);letter-spacing:-.04em;font-variant-numeric:lining-nums}
.resHead .p{font:500 26px/1 var(--sans);padding-bottom:.3em;color:var(--ink2)}
.verdict{margin:14px 0 0;text-align:center;font:400 12.5px/1.5 var(--sans);letter-spacing:-.02em;white-space:nowrap;color:var(--ink2)}
.vs{margin:6px 0 0;text-align:center;font:500 13.5px/1.6 var(--sans);color:var(--blue)}
.vs:empty{display:none}

.regRow .rv b{font:400 30px/1 var(--serif);font-weight:400;margin:0 2px}
.chartbox{margin-top:22px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.bar{transform-box:fill-box;transform-origin:50% 100%;transition:transform .9s var(--ease)}
.bar.pre{transform:scaleY(0)!important;transition:none}
.bars-lo rect{fill:var(--bar)}
.bars-hi rect{fill:var(--ink)}
.axis-line{stroke:var(--line2);stroke-width:1}
.tick{stroke:var(--line2);stroke-width:1}
.tick-t{font:500 10.5px var(--sans);fill:var(--ink3)}
.meanline{stroke:var(--ink3);stroke-width:1;stroke-dasharray:2 3}
.me-line{stroke:var(--blue);stroke-width:2}
@keyframes barWave{0%,100%{opacity:1}50%{opacity:.5}}
.bars-lo rect,.bars-hi rect{animation:barWave 2.4s ease-in-out infinite}
.me-dot{fill:var(--blue);stroke:var(--bg);stroke-width:2}
.me-pill{fill:var(--blue)}
.me-pt{font:600 11.5px var(--sans);fill:#06351C}
.fr-line{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
.fr-pill{fill:var(--bg);stroke:var(--ink);stroke-width:1}
.fr-pt{font:600 11.5px var(--sans);fill:var(--ink)}


.foot{margin:22px 0 0;padding-top:14px;text-align:center;font:400 9px/1.6 var(--sans);color:var(--ink3);opacity:.55}
.foot p{margin:0 0 6px}

.bar-b{position:sticky;bottom:0;flex:none;padding:12px 20px calc(30px + var(--sab));background:linear-gradient(to top,var(--bg) 72%,transparent);z-index:10}
.cta{width:100%;height:56px;border-radius:15px;background:var(--ink);color:var(--on-ink);font:500 15.5px/1 var(--sans);transition:opacity .3s,transform .2s}
.cta:active{transform:scale(.99);opacity:.86}
.cta2{display:block;width:100%;height:50px;margin-bottom:8px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font:500 14.5px/1 var(--kr);transition:background .25s,transform .18s}
.cta2:active{transform:scale(.99);background:var(--bg2)}
.cta2[hidden]{display:none}
.bar-b[hidden]{display:none}

dialog{border:0;padding:0;margin:auto auto 0;background:var(--bg);color:var(--ink);width:min(430px,100vw);max-height:92dvh;
  border-radius:22px 22px 0 0;overflow:auto;box-shadow:0 -10px 50px rgba(0,0,0,.22)}
@media (min-width:431px){dialog{margin:auto;border-radius:20px}}
dialog::backdrop{background:rgba(60,0,0,.55)}
dialog[open]{animation:sheetIn .5s var(--ease) both}
@keyframes sheetIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.sheet{padding:18px 20px calc(20px + var(--sab))}
.sheet header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet h2{margin:0;font:500 16px/1.4 var(--sans)}
.sheet .x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);margin-right:-8px}
.cardimg{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line2);background:var(--bg2);aspect-ratio:1080/1350}
.sheet .row{display:grid;gap:8px;margin-top:14px}
.sheet .row.two{grid-template-columns:1fr 1fr}
.btn{height:52px;border-radius:14px;font:500 14.5px/1 var(--sans);border:1px solid var(--line2);background:var(--bg);transition:background .25s}
.btn:active{background:var(--bg2)}
.btn.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.sheet .note{margin:10px 0 0;font:400 11.5px/1.5 var(--sans);color:var(--ink3);text-align:center}

.intro{flex:1;display:flex;align-items:center;justify-content:center;padding:0 10px 10px}
.introArt{width:100%;max-width:300px;height:auto;opacity:0;transform:translateY(10px);
  transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
.introArt.on{opacity:1;transform:none}
.paper{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);
  z-index:400;pointer-events:none;
  background-image:url("paper.png");
  background-size:cover;background-repeat:no-repeat;background-position:center center;background-attachment:scroll;
  mix-blend-mode:multiply;opacity:0;transition:opacity .45s ease}
.paper.on{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(26px + var(--sab));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:12px;font:500 13px/1 var(--sans);transition:opacity .35s,transform .45s var(--ease);z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-height:700px){
  h1{margin-top:16px;font-size:23px}
  .hval input{font-size:68px}
  .dial{width:158px;height:158px}
  .dial .cnt{font-size:38px}
  .calcbars{margin-top:20px;height:48px}
  }

.facts{margin:24px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts>div{padding:16px 12px 15px;border-radius:16px;background:var(--bg2);text-align:center;min-width:0}
.facts dt{font:400 11.5px/1.4 var(--sans);color:var(--ink3)}
.facts dd{margin:6px 0 0;font:400 26px/1.1 var(--serif);color:var(--ink)}
.facts dd small{font:400 12px/1 var(--sans);color:var(--ink2);margin-left:3px}
.facts .s{display:block;margin-top:5px;font:400 11px/1.5 var(--sans);color:var(--ink3)}

/* ---- entrance motion ---- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeOnly{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.screen.on>*,.screen.on>.scr>*,.screen.on>.res>*,.screen.on>.mapwrap>*,.screen.on>.hbox>*{
  animation:fadeUp .55s var(--ease) both}
.screen.on>h1,.screen.on>.sub,.screen.on>.scr>.scoreTag,.screen.on>.scr>.cite,
.screen.on>.hbox>.swipe,.screen.on>.mapwrap>.mapcap,.screen.on>.verdict,.screen.on>.vs,.screen.on>.foot{
  animation-name:fadeOnly}
.screen.on>*:nth-child(2),.screen.on>.scr>*:nth-child(2),.screen.on>.mapwrap>*:nth-child(2),.screen.on>.hbox>*:nth-child(2){animation-delay:.07s}
.screen.on>*:nth-child(3),.screen.on>.scr>*:nth-child(3),.screen.on>.mapwrap>*:nth-child(3),.screen.on>.hbox>*:nth-child(3){animation-delay:.14s}
.screen.on>*:nth-child(4),.screen.on>.scr>*:nth-child(4){animation-delay:.21s}
.screen.on>*:nth-child(5),.screen.on>.scr>*:nth-child(5){animation-delay:.28s}
.screen.on>*:nth-child(6){animation-delay:.35s}
.scoreTag.on{opacity:1}
.scoreHead{animation:popIn .7s var(--ease) both}
.resHead{animation:popIn .7s var(--ease) both}
@keyframes bump{0%{transform:none}35%{transform:translateY(-5px)}100%{transform:none}}
.hval.bump{animation:bump .42s var(--ease)}
.kmap .reg{transform-box:fill-box;transform-origin:50% 50%}

@keyframes regPop{0%{fill:var(--blue);transform:scale(1)}45%{fill:var(--blue);transform:scale(1.06)}100%{fill:var(--ink);transform:scale(1)}}
.flagless{}
.bar-b .cta,.fillO .fx{transition:transform .22s var(--ease),opacity .3s,background .3s}
.bar-b .cta:active,.fillO .fx:active{transform:scale(.97)}
.opt,.chart,.facts>div:nth-child(2){animation-delay:.08s}
@media (prefers-reduced-motion:reduce){
  .feed .fl,.feed .fl .tick svg{animation:none!important}
  .feed .fl .tick svg{stroke-dashoffset:0}
  .bars-lo rect,.bars-hi rect{animation:none!important}
  .screen.on>*,.screen.on>.scr>*,.screen.on>.res>*,.screen.on>.mapwrap>*,.screen.on>.hbox>*,
  .scoreHead,.resHead,.facts>div,.hval.bump,.kmap .reg.sel{animation:none!important}
}
@media (prefers-reduced-motion:reduce){
  .screen.on,dialog[open]{animation:none}
  .bar,.toast,.prog i,.dial .arc,.calcbars rect{transition:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="back" id="back" type="button" aria-label="이전 단계" hidden>

function buildCDF(r){
  var xs=[Math.min(r.min,137)],ys=[0],c=0,i;
  for(i=0;i<EDGES.length;i++){c+=r.bins[i];xs.push(EDGES[i]);ys.push(c);}
  c+=r.bins[14];xs.push(Math.max(r.max,202));ys.push(c);
  var n=xs.length,h=[],d=[],m=new Array(n);
  for(i=0;i<n-1;i++){h[i]=xs[i+1]-xs[i];d[i]=(ys[i+1]-ys[i])/h[i];}
  for(i=1;i<n-1;i++){
    if(d[i-1]*d[i]<=0){m[i]=0;}
    else{var w1=2*h[i]+h[i-1],w2=h[i]+2*h[i-1];m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i]);}
  }
  function end(h0,h1,d0,d1){var v=((2*h0+h1)*d0-h0*d1)/(h0+h1);
    if(v*d0<=0)return 0;if(d0*d1<=0&&Math.abs(v)>3*Math.abs(d0))return 3*d0;return v;}
  m[0]=end(h[0],h[1],d[0],d[1]);m[n-1]=end(h[n-2],h[n-3],d[n-2],d[n-3]);
  r.total2=c;
  r.cdf=function(x){
    if(x<=xs[0])return 0;if(x>=xs[n-1])return c;
    var k=0;while(k<n-2&&x>xs[k+1])k++;
    var t=(x-xs[k])/h[k],t2=t*t,t3=t2*t;
    return Math.min(c,Math.max(0,(2*t3-3*t2+1)*ys[k]+(t3-2*t2+t)*h[k]*m[k]+(-2*t3+3*t2)*ys[k+1]+(t3-t2)*h[k]*m[k+1]));
  };
}

  ctx.font=[cs.fontStyle,cs.fontWeight,cs.fontSize,cs.fontFamily].join(' ');
  var val=inp.value||'0',m=ctx.measureText(val),w=m.width;
  if(!w)return;

  // vertical: align 'cm' to the optical centre of the digits, not the line box
  var box=inp.offsetHeight||parseFloat(cs.fontSize);

  var abA=m.actualBoundingBoxAscent,abD=m.actualBoundingBoxDescent;

var scTimers=[];
function spinScore(sc){
  var el=$('scNum'),txt=sc.toFixed(1),chars=txt.split('');

  var digitPos=[];
  chars.forEach(function(c,i){if(c!=='.')digitPos.push(i);});
  var order=digitPos.slice().reverse();   // 소수점 자리 → 일의 자리 → 십의 자리
  var reels=[];
  chars.forEach(function(c,i){
    if(c==='.'){
      var d=document.createElement('span');d.className='dot';d.textContent='.';
      el.appendChild(d);return;
    }
    var wrap=document.createElement('span');wrap.className='reel';
    var strip=document.createElement('span');strip.className='strip';
    var html='';
    for(var cy=0;cy<3;cy++)for(var n=0;n<10;n++)html+='<i>'+n+'</i>';
    strip.innerHTML=html;
    wrap.appendChild(strip);el.appendChild(wrap);
    reels.push({wrap:wrap,strip:strip,digit:+c,pos:i});
  });
  reels.forEach(function(r){
    var k=order.indexOf(r.pos),cell=0;
    scTimers.push(setTimeout(function(){
      cell=r.strip.querySelector('i').getBoundingClientRect().height||1;
      r.strip.style.setProperty('--cell',cell+'px');
      r.strip.style.animation='reelSpin .5s linear infinite';
    },60));
    scTimers.push(setTimeout(function(){
      if(!cell)cell=r.strip.querySelector('i').getBoundingClientRect().height||1;
      var m=getComputedStyle(r.strip).transform,cur=0;
      if(m&&m!=='none'){var pm=m.match(/matrix\(([^)]+)\)/);if(pm)cur=parseFloat(pm[1].split(',')[5]);}

      r.strip.style.transform='translateY(-'+((10+r.digit)*cell).toFixed(2)+'px)';
    },1500+k*1350));
  });
  scTimers.push(setTimeout(function(){$('scTag').classList.add('on');},1500+(order.length-1)*1350+900));
}

    ctx.beginPath();ctx.moveTo(X(a),cy+ch);
    for(var c=a;c<=b;c+=0.5)ctx.lineTo(X(c),cy+ch-dens(c)*ch);
    ctx.lineTo(X(b),cy+ch);ctx.closePath();ctx.fillStyle=col;ctx.fill();
  }
  area(L,R,BAR);
  area(L,Math.min(R,Math.max(L,state.h)),INK);
  ctx.fillStyle='#C01D1D';ctx.fillRect(cx,cy+ch,cw,2);
  ctx.fillStyle=GREEN;ctx.fillRect(ux-2.5,cy-10,5,ch+10);
  ctx.beginPath();ctx.arc(ux,cy+ch,14,0,Math.PI*2);ctx.fill();
  ctx.lineWidth=5;ctx.strokeStyle='#AF0000';ctx.stroke();
  ctx.font='500 24px '+SA;ctx.fillStyle=GRAY;
  [160,170,180,190].forEach(function(c){
    ctx.textAlign='center';ctx.fillText(c,X(c),cy+ch+42);
  });
  ctx.textAlign='left';

  ctx.fillStyle=INK;ctx.font='400 30px '+KR;
  ctx.fillText('전국 키 순위 상위 '+fmtTop(s.top)+'% · '+reg.label+' '+fmtTop(rs.top)+'%',P,cy+ch+110);
  ctx.fillStyle=GRAY;ctx.font='400 22px '+SA;
  ctx.fillText('여성이 고른 이상형 남성 키 분포 (프랑스 연구 + 한국 설문)',P,H-60);
  return cv;
}
function makeCard(){
  var ready=(document.fonts&&document.fonts.load)?Promise.all([
    document.fonts.load('300 40px "Noto Serif KR"'),document.fonts.load('400 40px "Noto Serif KR"'),
    document.fonts.load('400 40px "Instrument Serif"'),document.fonts.load('500 24px "IBM Plex Sans KR"')
  ]).catch(function(){}):Promise.resolve();
  return ready.then(function(){
    var cv=drawCard(),url=cv.toDataURL('image/png');
    return new Promise(function(res){
      if(cv.toBlob)cv.toBlob(function(b){res({url:url,blob:b});},'image/png');else res({url:url,blob:null});
    });
  });
}
var sheet=$('sheet'),lastCard=null;
function openShare(){
  $('cardImg').removeAttribute('src');
  makeCard().then(function(c){lastCard=c;$('cardImg').src=c.url;});
  if(sheet.showModal)sheet.showModal();else sheet.setAttribute('open','');
  var can=!!navigator.share;
  $('nativeShare').style.display=can?'':'none';
  $('sheetRow').className='row'+(can?' two':'');
}
$('sheetX').addEventListener('click',function(){sheet.close();});
sheet.addEventListener('click',function(e){if(e.target===sheet)sheet.close();});
$('copyLink').addEventListener('click',function(){
  copyText(shareText()+'\n'+shareUrl()).then(function(){toast('링크를 복사했어요');})
  .catch(function(){toast('복사하지 못했어요. 주소창의 링크를 직접 복사해 주세요');});
});
$('nativeShare').addEventListener('click',function(){
  var d={title:'내 키 몇 %',text:shareText(),url:shareUrl()};
  try{
    if(lastCard&&lastCard.blob&&navigator.canShare&&window.File){
      var f=new File([lastCard.blob],'my-height.png',{type:'image/png'});
      if(navigator.canShare({files:[f]}))d={title:'내 키 몇 %',text:shareText()+'\n'+shareUrl(),files:[f]};
    }
  }catch(_){}
  navigator.share(d).catch(function(err){
    if(err&&err.name==='AbortError')return;
    copyText(shareText()+'\n'+shareUrl()).then(function(){toast('링크를 복사했어요');}).catch(function(){});
  });
});

var ICON={
  milk:'<svg width="W" height="H" viewBox="0 0 24 34" fill="currentColor"><path d="M4 9.2 12 2l8 7.2V32a1.6 1.6 0 0 1-1.6 1.6H5.6A1.6 1.6 0 0 1 4 32V9.2Zm2.6.9v21.3h10.8V10.1L12 5.3 6.6 10.1Z"/><path d="M8.4 13.6h7.2v2.6H8.4z"/></svg>',
  fish:'<svg width="W" height="H" viewBox="0 0 34 20" fill="currentColor"><path d="M12.6 2.1c5.5 0 10 2.8 12.5 6.1l5-4a.9.9 0 0 1 1.5.9l-1.6 4.9 1.6 4.9a.9.9 0 0 1-1.5.9l-5-4c-2.5 3.3-7 6.1-12.5 6.1C6.3 17.9 1.4 14.4 0 10c1.4-4.4 6.3-7.9 12.6-7.9Zm-4.2 6.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg>'
};
var fillRaf=0,fillStage=null;
var fillToken=0;
function openFill(kind){
  if(!gapData||gapData.gap<=0){openShare();return;}
  cancelAnimationFrame(fillRaf);
  var myToken=++fillToken;
  fillStage=kind;
  var d=kind==='milk'?gapData.milk:gapData.fish;
  var total=Math.round(d.total),unitTx=kind==='milk'?'곽':'마리';
  $('fillUnit').innerHTML='';$('fillUnit').classList.remove('on');
  var down=(gapData.mode==='down');
  var l1=document.createTextNode(comma(total)+(kind==='milk'
    ? (down?'곽의 우유를 평균 키 남성이 마셨더라면':'곽의 우유를 성장기에 마셨더라면')
    : (down?'마리의 고등어를 평균 키 남성이 먹었더라면':'마리의 고등어를 성장기에 먹었더라면')));
  var l2=document.createElement('span');
  l2.className='fu2';
  l2.textContent=(down?'당신의 키가 되었을 지도 모르는 일입니다...':'이상형의 키가 되었을 지도 모르는 일입니다...');
  $('fillUnit').appendChild(l1);$('fillUnit').appendChild(l2);
  $('fillCite').textContent=(kind==='milk'
    ? 'Dairy products and physical stature: A systematic review and meta-analysis of controlled trials (Economics and Human Biology, 2012)'
    : 'Vitamin D supplementation and growth in urban Mongol school children: Results from two randomized clinical trials (PLoS ONE, 2017)');
  $('fillNext').innerHTML='<span></span>';
  $('fillNext').firstChild.textContent=(kind==='milk'?'또 뭘 해야 했을까':'친구에게 공유하기');
  var o=$('fillO'),grid=$('fillGrid');
  o.hidden=false;grid.innerHTML='';$('fillNum').textContent='0';
  requestAnimationFrame(function(){
    if(myToken!==fillToken)return;
    grid.innerHTML='';
    var gw=grid.clientWidth,gh=grid.clientHeight;
    var iw=kind==='milk'?16:22, ih=kind==='milk'?23:13;
    var cols=Math.max(1,Math.floor((gw+4)/(iw+4))),rows=Math.max(1,Math.floor((gh+4)/(ih+4)));
    var cap=Math.min(total,cols*rows);
    var svg=ICON[kind].replace('W',iw).replace('H',ih);
    var DUR=reduce?300:2600,t0=performance.now(),placed=0;
    function step(now){
      if(myToken!==fillToken)return;
      var p=Math.min(1,(now-t0)/DUR),e=1-Math.pow(1-p,2);
      var want=Math.round(e*cap);
      if(want>placed){
        var buf='';
        for(var i=placed;i<want;i++)buf+=svg;
        grid.insertAdjacentHTML('beforeend',buf);
        placed=want;
      }
      $('fillNum').textContent=comma(Math.round(e*total));
      if(p<1)fillRaf=requestAnimationFrame(step);
      else{$('fillNum').textContent=comma(total);$('fillUnit').classList.add('on');}
    }
    fillRaf=requestAnimationFrame(step);
  });
}
function closeFill(){fillToken++;cancelAnimationFrame(fillRaf);$('fillO').hidden=true;}
$('fillNext').addEventListener('click',function(){
  if(fillStage==='milk')openFill('fish');
  else{closeFill();openShare();}
});
$('fillClose').addEventListener('click',function(){closeFill();});
(function(){
  var el=document.querySelector('.paper'),im=new Image();
  im.onload=function(){el.classList.add('on');};
  im.src='paper.png';
  if(im.complete)el.classList.add('on');
})();
drawRuler();setH(175);
go(1);
var lw=ruler.clientWidth,cw0=0;
if(window.ResizeObserver){
  new ResizeObserver(function(){
    if(Math.abs(ruler.clientWidth-lw)>1){lw=ruler.clientWidth;drawRuler();layoutUnit();}
    var c=$('chart').clientWidth;
    if(G.rects&&c>0&&Math.abs(c-cw0)>1){cw0=c;buildChart(false);}
  }).observe(document.body);
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){drawRuler();layoutUnit();});
})();
